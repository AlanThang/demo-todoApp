<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan's Task Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>

<main class="wrapper">

    <header class="site-header">
        <div class="logo">✦ TaskBoard</div>
        <div class="header-meta" id="taskCount">0 tasks</div>
    </header>

    <section class="form-card">
        <h1 class="form-title">What's next?</h1>
        <form id="todoForm">
            <div class="field-group">
                <input class="field" type="text" placeholder="Task title..." id="title" autocomplete="off">
                <input class="field" type="text" placeholder="Add a description..." id="description" autocomplete="off">
            </div>
            <div class="form-actions">
                <button type="button" id="btn-reset" class="btn btn-ghost">Cancel</button>
                <button type="submit" id="btn-add" class="btn btn-primary">
                    <span class="btn-icon">＋</span> Add Task
                </button>
            </div>
        </form>
    </section>

    <section class="board">
        <div class="board-header">
            <h2 class="board-title">Your Tasks</h2>
            <button onclick="removeAll()" class="btn btn-danger-ghost">Clear all</button>
        </div>
        <div id="taskList" class="task-list"></div>
    </section>

</main>

<script src="main.js"></script>
</body>
</html>
