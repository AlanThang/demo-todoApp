<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">

        <form action="" id="todoForm">
            <h1>Todo app</h1>
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input class="form-control" type="text" placeholder="title..." name="title" id="title">
            </div>
    
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input class="form-control" type="text" placeholder="Description..." name="description" id="description">
            </div>
    
            <div class="mb-3 group-btn">
                <button id="btn-reset" class="btn btn-secondary" type="button">Reset</button>
                <button id="btn-add" class="btn btn-primary">Add</button>

            </div>
    
        </form>

        <table class="table table-bordered boder-stripted text-center">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>
                        <span>Action</span>
                        <button onclick="removeAll()" class="btn btn-danger">Remove all</button>

                    </th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td>123</td>
                    <td>Học lập trình</td>
                    <td>Học html</td>
                    <td>
                        <button class="btn btn-warning">
                            Update
                        </button>
                        <button class="btn btn-warning">
                            Remove
                        </button>
                    </td>
                </tr>
                <!-- <tr>
                    <td colspan="4">Nothing todo</td>
                </tr> -->
            </tbody>
        </table>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="main.js"> </script>


</body>

</html>
